# Tag-triggered release: builds the release APK and attaches it to a GitHub release with checksums.txt.
# Signed when the KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets are set,
# otherwise the APK is published unsigned (marked "-unsigned" in its name).
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Job-level so the step `if:` below can see it.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tag matches APP_VERSION_NAME
        run: |
          VERSION="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION_NAME $VERSION in gradle.properties (expected v$VERSION)"
            exit 1
          fi
      - name: Test and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Decode release keystore (if the secret is set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Package
        run: |
          mkdir -p release_assets
          OUT=app/build/outputs/apk/release
          if [ -f "$OUT/app-release.apk" ]; then
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
            "$APKSIGNER" verify --print-certs "$OUT/app-release.apk"
            cp "$OUT/app-release.apk" "release_assets/EZ-Cam-Mic-${GITHUB_REF_NAME}.apk"
          else
            echo "::warning::No signing secrets set; publishing an unsigned APK."
            cp "$OUT/app-release-unsigned.apk" "release_assets/EZ-Cam-Mic-${GITHUB_REF_NAME}-unsigned.apk"
          fi
          cd release_assets
          sha256sum EZ-Cam-Mic-* > checksums.txt
          cat checksums.txt
      # Free provenance attestation. Note: on PRIVATE repos GitHub only supports attestations on
      # Enterprise Cloud plans, so the step is skipped while the repo is private.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release_assets/EZ-Cam-Mic-*
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/EZ-Cam-Mic-*
            release_assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
