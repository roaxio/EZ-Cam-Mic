name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Also validates gradle/wrapper/gradle-wrapper.jar and caches Gradle downloads
      # (cache is written only on main, read-only on other branches and PRs).
      - uses: gradle/actions/setup-gradle@v6
      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ezcammic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
