version: 2
updates:
  # GitHub Actions (bi-weekly on 1st & 15th, grouped into 1 PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
      timezone: "UTC"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"

  # Gradle (libs.versions.toml / build.gradle.kts), bi-weekly, grouped by area
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns:
          - "com.android.application*"
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "gradle-wrapper"
      coroutines-and-core:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
          - "androidx.core*"
          - "androidx.test*"
      camera-and-crypto:
        patterns:
          - "androidx.camera*"
          - "org.bouncycastle*"
      compose-and-testing:
        patterns:
          - "androidx.compose*"
          - "androidx.navigation*"
          - "androidx.lifecycle*"
          - "androidx.activity*"
          - "org.robolectric*"
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
